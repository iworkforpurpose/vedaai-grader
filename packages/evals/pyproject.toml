[project]
name = "vedaai-evals"
version = "0.1.0"
description = "Golden set, synthetic generator and accuracy metrics for the answer-sheet grader."
requires-python = ">=3.12"
dependencies = [
  "vedaai-contracts",
  "vedaai-grader-api",
  "pydantic>=2.9",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]
# Needed to score real pages: they are the only samples where transcription and
# ink come from independent mechanisms, which is what makes the agreement metric
# mean anything. Synthetic samples do not need it.
ocr-local = ["paddlepaddle>=3.3", "paddleocr>=3.7"]
# Needed to score with the same scorer the deployed service uses. Without it
# `semantic_available()` is False and mapping is scored by word overlap, which is
# a different product: every published mapping figure was measured that way
# before this was noticed, and the report now says which one ran.
semantic = ["openai>=1.50"]
# Needed to read a scanned answer sheet, which is what the deployed service does.
# Without boto3 `select_engine` cannot build the Textract engine, transcription
# returns nothing, and a scanned document scores zero — which the gate reports as
# a marking catastrophe rather than as a missing dependency. Four of its nine
# documents are scans, and all four read as total failures until this was added.
aws = ["boto3>=1.35"]
# Local entailment and embeddings, so the harness runs what the service runs.
# Without it the scorer silently drops to word overlap and the marker cannot be
# measured at all — the same class of gap as the missing `.env` and the missing
# recognizer, found the same way.
nli = ["torch>=2.4", "transformers>=4.44", "sentencepiece>=0.2"]

[tool.uv.sources]
vedaai-contracts = { path = "../contracts", editable = true }
vedaai-grader-api = { path = "../../apps/api", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vedaai_evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vedaai_evals"]
known-third-party = ["vedaai_contracts", "grader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs the local OCR model or real sample data"]
