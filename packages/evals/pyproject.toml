[project]
name = "vedaai-evals"
version = "0.1.0"
description = "Golden set, synthetic generator and accuracy metrics for the answer-sheet grader."
requires-python = ">=3.12"
dependencies = [
  "vedaai-contracts",
  "vedaai-grader-api",
  "pydantic>=2.9",
  "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv.sources]
vedaai-contracts = { path = "../contracts", editable = true }
vedaai-grader-api = { path = "../../apps/api", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vedaai_evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vedaai_evals"]
known-third-party = ["vedaai_contracts", "grader"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: needs the local OCR model or real sample data"]
