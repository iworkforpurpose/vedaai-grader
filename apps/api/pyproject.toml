[project]
name = "vedaai-grader-api"
version = "0.1.0"
description = "Question extraction, answer mapping and highlight geometry for handwritten answer sheets."
requires-python = ">=3.12"
dependencies = [
  "vedaai-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "python-multipart>=0.0.12",
  "pymupdf>=1.24",
  # Upper bound deliberate. An unpinned bound resolved to 5.0.0.93 while adding an
  # unrelated dependency, and that wheel imports as an empty module — cv2.__file__
  # is None and every function is missing, which surfaces as "module 'cv2' has no
  # attribute 'line'" fifty tests deep rather than as an install failure. A major
  # version of a C-extension library is not something to accept silently.
  "opencv-python-headless>=4.10,<5",
  "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.8"]
# Local handwriting recognition. Kept out of the base install because it pulls
# ~600 MB of framework and model weights, and the question-paper half of the
# pipeline runs fine without it.
ocr-local = ["paddlepaddle>=3.3", "paddleocr>=3.7"]
# Automatic marking. Optional because the rest of the product — extraction,
# mapping and highlighting — is complete without it, and marking degrades to a
# rubric the teacher fills in rather than failing.
grading = ["anthropic>=0.40"]
# Hosted handwriting recognition and page storage. Small next to the local model,
# and the only option that needs no weights shipped in the image.
aws = ["boto3>=1.35"]

[tool.uv.sources]
vedaai-contracts = { path = "../../packages/contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# Local OCR model init costs ~46s and each page ~14s, which is too slow for the
# default loop. Run them deliberately: `pytest -m slow`.
addopts = "-m 'not slow'"
markers = [
  "slow: exercises the local OCR model; excluded by default",
]

[tool.ruff.lint.isort]
known-first-party = ["grader"]
known-third-party = ["vedaai_contracts"]
