# Build, verify and roll out the grader.
#
# Exists because every deploy before it happened from a laptop, and `docker build`
# reads the working directory rather than a commit — so what was running could not be
# traced back to anything, and an uncommitted edit would have shipped with nothing
# recording that it had. Here the commit *is* the input.
#
# No stored AWS keys. The job exchanges GitHub's OIDC token for a role scoped to
# this repository on this branch, so a pull request from a fork cannot deploy even
# though it can run the tests.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway. Cancelling between the
# registration and the rollout leaves the service pinned to a revision nobody
# chose — which is the failure this pipeline is partly here to make impossible.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  APP: vedaai-grader

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose. `package.json` already pins
      # `packageManager: pnpm@10.33.2`, and specifying it twice is an error rather
      # than a preference — the action refuses to guess which one is authoritative.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      # The contracts are generated, not committed, and the type check depends on
      # them — so this has to happen before anything reads them.
      - name: Generate contracts
        run: pnpm turbo codegen

      - name: Typecheck
        run: pnpm turbo typecheck

      # `turbo test`, not a copy of each command.
      #
      # This job originally spelled the API command out itself, and it was wrong in
      # a way that only a clean machine could reveal: `--extra dev` does not install
      # boto3, and two test modules import botocore. It passed locally because that
      # venv happened to have the aws extra from an earlier sync. Running the
      # packages' own scripts means CI and a laptop cannot drift apart.
      - name: Tests
        run: pnpm turbo test

  deploy:
    name: deploy
    # Only from main, and only if the tests passed. A deploy that skips its own
    # tests is a deploy nobody can trust, and I have been the one asserting they
    # passed until now.
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      # No stored keys: GitHub's OIDC token is exchanged for the role.
      #
      # The role's trust policy pins the subject claim exactly, and the claim is not
      # the documented `repo:owner/name:ref:...` shape. This account has GitHub's
      # immutable subject claim enabled, so it arrives as
      # `repo:owner@<ownerId>/name@<repoId>:ref:refs/heads/main` — the numeric ids
      # make the subject survive a rename. Every mismatch produces the same
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity", which is why this
      # took reading the token rather than reasoning about it.
      #
      # Pinning the ids is stronger than pinning the names: a repository deleted and
      # recreated under the same name gets a new id and stops being trusted, which
      # is exactly what the immutable claim is for.
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::872483264706:role/vedaai-grader-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity

      # The commit is the tag. `deploy/deploy.sh` derives one itself when this is
      # unset, but passing it explicitly means the log says what it built before it
      # starts building.
      - name: Build, push and roll out
        env:
          IMAGE_TAG: ${{ github.sha }}
          GROQ_SECRET_ARN: ${{ vars.GROQ_SECRET_ARN }}
          OPENAI_SECRET_ARN: ${{ vars.OPENAI_SECRET_ARN }}
          # The passcode in front of the origin. A secret rather than a var
          # because vars are readable by anyone with access to the repository's
          # settings, and this one is meant to be handed only to testers.
          #
          # `deploy.sh` refuses to release without it, so a missing secret is a
          # red build rather than an origin quietly open to the internet.
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        run: |
          echo "deploying ${GITHUB_SHA} to ${AWS_REGION}"
          bash deploy/deploy.sh release

      # `release` already reads back the pinned revision and fails if it does not
      # match. This waits for the task to actually be serving it, which is a
      # different claim: a rollout can be accepted and then the task can fail to
      # start.
      - name: Wait for the new task to be stable
        run: |
          aws ecs wait services-stable --cluster "$APP" --services "$APP"

      # Without this the stable URL is only stable until the next deploy: the task
      # gets a new IP each rollout, and the gateway would keep pointing at the old
      # one. This is the step that makes the address mean anything.
      - name: Aim the gateway at the new task
        run: bash deploy/gateway.sh point

      - name: Report what is live
        run: |
          set -euo pipefail
          task="$(aws ecs list-tasks --cluster "$APP" --service-name "$APP" \
                    --desired-status RUNNING --query 'taskArns[0]' --output text)"
          image="$(aws ecs describe-tasks --cluster "$APP" --tasks "$task" \
                    --query 'tasks[0].containers[0].image' --output text)"
          rev="$(aws ecs describe-services --cluster "$APP" --services "$APP" \
                    --query 'services[0].taskDefinition' --output text)"
          eni="$(aws ecs describe-tasks --cluster "$APP" --tasks "$task" \
                    --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value | [0]" \
                    --output text)"
          ip="$(aws ec2 describe-network-interfaces --network-interface-ids "$eni" \
                    --query 'NetworkInterfaces[0].Association.PublicIp' --output text)"

          code="$(curl -s -o /dev/null -m 20 -w '%{http_code}' "http://${ip}:8080/" || echo 000)"

          # The job summary, because "what exactly and when exactly did I deploy" is
          # the question this whole pipeline exists to answer.
          stable="$(bash deploy/gateway.sh url)"
          # Health rather than the front page. The origin is behind a passcode, so
          # `/` answers 307 to the unlock screen — which is the gate working, and
          # would fail a check for 200. Health is deliberately open (the container
          # probe needs it) and proves the same two things this step is for: the
          # task is serving, and the gateway points at it.
          scode="$(curl -s -o /dev/null -m 25 -w '%{http_code}' "${stable}/api/health" || echo 000)"
          # What will actually mark the next submission.
          #
          # A 200 from /health used to be the whole release check, and /health said
          # nothing about grading — so a rotated key, a dropped secret ARN or an
          # empty provider account all shipped green while every submission came
          # back zeros. That happened. The build is red for it now.
          # `deep=1`: ask the provider whether it will actually answer, not just
          # whether a key is present. The first version of this check asked only
          # the second question, and a deployment whose account had run out of
          # credit passed it while every submission came back zeros. One request,
          # once per release, cached behind the endpoint.
          health="$(curl -s -m 40 "${stable}/api/health?deep=1" || echo '{}')"
          # One parse, five values, in a file that can be tested.
          #
          # This was four `python3 -c` calls with escaped quotes inside a YAML
          # string inside a shell substitution, and the one needing an f-string did
          # not survive the trip: it failed silently and the summary said
          # `grading: unknown` while the payload plainly said `openai:gpt-4.1`.
          {
            read -r marking
            read -r marker
            read -r placing
            read -r why
            read -r throttled
          } < <(printf '%s' "$health" | python3 deploy/health_summary.py)
          # Checked separately, because "the gate is on" is its own claim and the
          # cost of it being quietly off is every stored script.
          gate="$(curl -s -o /dev/null -m 25 -w '%{http_code}' "${stable}/" || echo 000)"
          if [ "${gate}" = "307" ]; then
            gate_note="(behind the access code)"
          else
            gate_note="(OPEN — anyone with the address can read every script)"
          fi

          {
            echo "### Deployed"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| **share this** | ${stable} |"
            echo "| commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| image | \`${image##*/}\` |"
            echo "| revision | \`${rev##*/}\` |"
            echo "| via gateway | HTTP ${scode} |"
            if [ "${marking}" != "yes" ] && [ "${throttled}" = "yes" ]; then
              echo "| marking | rate limited (\`${marker}\`) |"
            else
              echo "| marking | ${marking} (\`${marker}\`) |"
            fi
            if [ -n "${why}" ]; then echo "| provider said | ${why} |"; fi
            echo "| placing answers by | ${placing} |"
            echo "| front page | HTTP ${gate} ${gate_note} |"
            echo "| task directly | HTTP ${code} (http://${ip}:8080, changes each deploy) |"
          } >> "$GITHUB_STEP_SUMMARY"

          # The gateway is the address people are given, so that is the one whose
          # failure should fail the deploy.
          test "$scode" = "200"

          # A release that cannot mark is not a release. Marking is the half of
          # this product a teacher is actually asking for, and its absence is
          # silent everywhere else: the submission completes, the status is
          # `complete`, and every question reads zero.
          # A spent quota is not a broken release. The credential worked, the
          # provider answered, and the answer was "not until the window rolls".
          # Failing the build for that would mean the free tier can block a
          # deploy for the rest of the day over something no change can fix,
          # while a genuinely rejected key still has to be caught — so the two
          # are separated at the source rather than guessed at from a boolean.
          if [ "${marking}" != "yes" ] && [ "${throttled}" = "yes" ]; then
            echo "::warning::the marking provider is rate limited right now: ${why}"
            echo "::warning::the deployment is correct; marking resumes when the window rolls."
          elif [ "${marking}" != "yes" ]; then
            echo "::error::the deployed service cannot mark (grading: ${marker})."
            echo "::error::the provider was asked and did not answer: ${why}"
            echo "::error::check GROQ_SECRET_ARN, the secret's value, and the account balance."
            exit 1
          fi

          # Placing answers by word overlap rather than by meaning is a materially
          # different product. Not fatal — the pipeline is designed to degrade —
          # but it must never pass unremarked.
          if [ "${placing}" != "semantic" ]; then
            echo "::warning::answers will be placed by ${placing}, not by meaning."
          fi
