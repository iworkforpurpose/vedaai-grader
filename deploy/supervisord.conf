; Two processes in one container.
;
; supervisord rather than a shell script with `&`, for one reason that matters: if
; the worker dies, a shell script leaves the container up and serving pages while
; every upload fails. supervisord restarts it, and if it cannot, the exit code
; brings the task down so ECS replaces it — which is the behaviour a load balancer
; needs to route around the problem.

[program:api]
; Invoked as a module rather than through the console script, so the venv's
; shebangs are never consulted at all.
command=/repo/apps/api/.venv/bin/python -m uvicorn grader.main:app --host 127.0.0.1 --port 8000 --workers 1
directory=/repo/apps/api
autostart=true
autorestart=true
startretries=3
; A single worker on purpose. The submission store is in memory, so a second
; worker process would answer requests about submissions it has never seen —
; the same reason the service runs as one task.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:web]
command=node /repo/web/apps/web/server.js
directory=/repo/web
autostart=true
autorestart=true
startretries=3
environment=PORT="8080",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; Started after the worker so the first request does not race the proxy target.
priority=20
